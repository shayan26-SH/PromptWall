services:
  security-service:
    build: ./security-service
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  java-proxy:
    build: ./promptwall-java
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SECURITY_SERVICE_URL: http://security-service:8000
      UPSTREAM_URL: ${UPSTREAM_URL:-https://api.openai.com/v1/chat/completions}
      LLM_API_KEY: ${LLM_API_KEY:-}
      PROMPTWALL_API_KEY: ${PROMPTWALL_API_KEY:-}
    depends_on:
      - security-service

